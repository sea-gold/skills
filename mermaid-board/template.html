<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"></script>
<style>
  :root { color-scheme: light; }
  body { background:#fafaf7; color:#1a1a1a; font-family:"Microsoft YaHei",system-ui,sans-serif; margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .meta { color:#777; font-size:12px; margin-bottom:16px; }
  .card { background:#fff; border:1px solid #e5e2da; border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:#555; }
  pre.mermaid { margin:0; display:flex; justify-content:center; }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="meta">更新于 {{DATE}} · 源文件 {{MD_FILENAME}}</div>

<!-- 每个 mermaid 块一个卡片；多图时复制整个 .card。h2 可省略 -->
<div class="card">
  <h2>{{SECTION_TITLE}}</h2>
  <pre class="mermaid">
{{MERMAID_SOURCE}}
  </pre>
</div>

<script>
  mermaid.initialize({ startOnLoad: true, securityLevel: "strict", themeVariables: { fontFamily: '"Microsoft YaHei", sans-serif' } });
</script>
</body>
</html>
